poll_interval_seconds: 120
min_market_volume: 50000
min_market_liquidity: 25000
max_spread: 0.08
signal_alert_threshold: 75

polymarket:
  gamma_api_base: https://gamma-api.polymarket.com
  clob_api_base: https://clob.polymarket.com

price_move_windows_minutes:
  - 5
  - 15
  - 60

min_probability_move:
  window_5m: 0.05
  window_15m: 0.08
  window_60m: 0.12

priority_keywords:
  - AI
  - OpenAI
  - Anthropic
  - Nvidia
  - Fed
  - rate cut
  - CPI
  - inflation
  - recession
  - Bitcoin
  - BTC
  - Ethereum
  - ETH
  - crypto
  - stablecoin
  - ETF
  - tariff
  - China
  - Taiwan
  - Russia
  - Ukraine
  - Israel
  - oil

ignored_keywords:
  - NBA
  - NFL
  - UFC
  - soccer
  - celebrity
  - music
  - movie

telegram:
  enabled: true
  bot_token_env: TELEGRAM_BOT_TOKEN
  chat_id_env: TELEGRAM_CHAT_ID

storage:
  sqlite_path: storage/intelligence.db

runtime:
  dry_run: false
  request_timeout_seconds: 15
  max_retries: 3

reporting:
  enabled: true               # MD→HTML→Telegram brief pipeline
  daily_report_hour_utc: 23  # Hour (UTC) at which to emit daily report
